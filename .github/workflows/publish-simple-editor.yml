name: Publish simple editor to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'simple-editor/**'
      - '.github/workflows/publish-simple-editor.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload simple editor
        uses: actions/upload-pages-artifact@v5
        with:
          path: simple-editor
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
